<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="离线中英互译 —— 模型在浏览器本地运行，文本不上传，首次加载后可离线使用" />
  <title>离线翻译 - 网页工具箱</title>
  <link rel="icon" type="image/svg+xml" href="/local-toolbox/favicon.svg" />
  <script type="module" crossorigin src="/local-toolbox/assets/translate-C4tWY5wg.js"></script>
  <link rel="modulepreload" crossorigin href="/local-toolbox/assets/common-Ir7JNMuE.js">
  <link rel="modulepreload" crossorigin href="/local-toolbox/assets/clipboard-C24IsV_E.js">
  <link rel="stylesheet" crossorigin href="/local-toolbox/assets/common-BhPJDATC.css">
  <link rel="stylesheet" crossorigin href="/local-toolbox/assets/translate-Bgtqk9Ln.css">
</head>
<body>
  <main class="tool-container">
    <section class="mode-panel glass mode-panel--active">
      <div class="panel-desc">中英互译，模型在浏览器本地运行，文本不上传任何服务器。首次使用需下载模型（约 60MB），之后可离线使用。</div>

      <div class="translate-bar">
        <select class="codec-select" id="tr-direction" aria-label="翻译方向">
          <option value="auto">自动检测</option>
          <option value="zh-en">中文 → 英文</option>
          <option value="en-zh">英文 → 中文</option>
        </select>
        <span class="translate-status" id="tr-status" role="status">模型未加载</span>
        <button class="btn btn-secondary" id="btn-preload" type="button">预下载模型</button>
      </div>

      <div class="translate-progress" id="tr-progress" hidden>
        <div class="translate-progress__bar"><span id="tr-progress-fill"></span></div>
        <span class="translate-progress__text" id="tr-progress-text"></span>
      </div>

      <div class="translate-grid">
        <div class="translate-pane">
          <label class="codec-label" for="tr-input">原文</label>
          <textarea class="codec-input codec-input--tall" id="tr-input" placeholder="输入中文或英文…" spellcheck="false"></textarea>
          <div class="translate-pane__foot">
            <span id="tr-count">0 字符</span>
            <button class="btn btn-secondary btn-sm" id="btn-clear" type="button">清空</button>
          </div>
        </div>
        <div class="translate-pane">
          <label class="codec-label" for="tr-output">译文</label>
          <textarea class="codec-input codec-input--tall" id="tr-output" placeholder="译文会显示在这里" readonly></textarea>
          <div class="translate-pane__foot">
            <button class="btn btn-secondary btn-sm" id="btn-copy" type="button">复制译文</button>
            <button class="btn btn-primary btn-sm" id="btn-run" type="button">翻译</button>
          </div>
        </div>
      </div>
      <p class="translate-hint" id="tr-hint">提示：第一次翻译会先下载并初始化模型，需要等待几十秒；之后再次翻译是秒级。</p>
    </section>
  </main>
</body>
</html>
