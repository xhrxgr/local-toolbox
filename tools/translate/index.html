<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="离线中英互译 —— 模型在浏览器本地运行，文本不上传，首次加载后可离线使用" />
  <title>离线翻译 - 网页工具箱</title>
  <link rel="icon" type="image/svg+xml" href="/local-toolbox/favicon.svg" />
  <script type="module" crossorigin src="/local-toolbox/assets/translate-q6R1cQeJ.js"></script>
  <link rel="modulepreload" crossorigin href="/local-toolbox/assets/common-Ir7JNMuE.js">
  <link rel="modulepreload" crossorigin href="/local-toolbox/assets/clipboard-C24IsV_E.js">
  <link rel="stylesheet" crossorigin href="/local-toolbox/assets/common-BhPJDATC.css">
  <link rel="stylesheet" crossorigin href="/local-toolbox/assets/translate-Bddm-vAd.css">
</head>
<body>
  <main class="tool-container translate-page">
    <section class="mode-panel mode-panel--active translate-workspace">
      <header class="tr-head">
        <div class="tr-head__title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h10 M8 3v2c0 4-2.5 7-6 8 M6 9c1 3 3.5 5 7 6"/><path d="M13 19l4-8 4 8 M14.5 16h5"/></svg>
          <div>
            <h1>离线翻译</h1>
            <p>中英互译 · 模型在浏览器本地运行，文本不上传</p>
          </div>
        </div>
        <span class="tr-badge">无需联网</span>
      </header>

      <div class="tr-toolbar">
        <div class="tr-dir">
          <select class="codec-select" id="tr-direction" aria-label="翻译方向">
            <option value="auto">自动检测语言</option>
            <option value="zh-en">中文 → 英文</option>
            <option value="en-zh">英文 → 中文</option>
          </select>
          <button class="btn btn-secondary btn-sm tr-swap" id="btn-swap" type="button" title="互换翻译方向" aria-label="互换翻译方向">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13l-3-3 M17 17H4l3 3"/></svg>
          </button>
        </div>
        <span class="translate-status" id="tr-status" role="status">模型未加载</span>
        <button class="btn btn-secondary btn-sm" id="btn-preload" type="button">预下载模型</button>
      </div>

      <div class="translate-progress" id="tr-progress" hidden>
        <div class="translate-progress__bar"><span id="tr-progress-fill"></span></div>
        <span class="translate-progress__text" id="tr-progress-text"></span>
      </div>

      <div class="translate-grid">
        <div class="tr-card">
          <div class="tr-card__head">
            <span class="tr-card__title">原文</span>
            <span class="tr-card__meta" id="tr-lang-from">自动检测</span>
          </div>
          <textarea class="tr-textarea" id="tr-input" placeholder="输入中文或英文…" spellcheck="false"></textarea>
          <div class="tr-card__foot">
            <span class="tr-count" id="tr-count">0 字符</span>
            <button class="btn btn-secondary btn-sm" id="btn-clear" type="button">清空</button>
          </div>
        </div>

        <div class="tr-card tr-card--out">
          <div class="tr-card__head">
            <span class="tr-card__title">译文</span>
            <span class="tr-card__meta" id="tr-lang-to">—</span>
          </div>
          <textarea class="tr-textarea" id="tr-output" placeholder="译文会显示在这里" readonly></textarea>
          <div class="tr-card__foot">
            <button class="btn btn-secondary btn-sm" id="btn-copy" type="button">复制</button>
            <button class="btn btn-primary" id="btn-run" type="button">翻译</button>
          </div>
        </div>
      </div>

      <p class="translate-hint" id="tr-hint">首次翻译需下载模型（约 60MB）并初始化，可能需要几十秒；之后再次翻译为秒级。</p>
    </section>
  </main>
</body>
</html>
