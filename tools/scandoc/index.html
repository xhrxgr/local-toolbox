<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="扫描文档 —— 图片转文档，批量导入、文档滤镜、曲面矫正、四角裁剪、合并导出 PDF，全部本地处理" />
  <title>扫描文档 - 网页工具箱</title>
  <link rel="icon" type="image/svg+xml" href="/local-toolbox/favicon.svg" />
  <script type="module" crossorigin src="/local-toolbox/assets/scandoc--Ji89CV5.js"></script>
  <link rel="modulepreload" crossorigin href="/local-toolbox/assets/common-K9hJMKXr.js">
  <link rel="modulepreload" crossorigin href="/local-toolbox/assets/download-CylBT3IK.js">
  <link rel="modulepreload" crossorigin href="/local-toolbox/assets/rolldown-runtime-DAXXjFlN.js">
  <link rel="modulepreload" crossorigin href="/local-toolbox/assets/es-DInUeCLG.js">
  <link rel="stylesheet" crossorigin href="/local-toolbox/assets/common-CH68dhcV.css">
  <link rel="stylesheet" crossorigin href="/local-toolbox/assets/scandoc-DCgqG7TY.css">
</head>
<body>
  <main class="scan-app">
    <!-- 顶栏 -->
    <header class="scan-header glass">
      <div class="scan-header__title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <path d="M9 13l2 2 4-4"/>
        </svg>
        <h1>扫描文档</h1>
        <span class="scan-header__sub">图片 → 文档 · 本地处理</span>
      </div>
      <div class="scan-header__actions">
        <button class="btn btn-sm btn-secondary" id="btn-import" type="button">导入图片</button>
        <button class="btn btn-sm btn-clear-all" id="btn-clear" type="button">清空</button>
        <input type="file" id="file-input" accept="image/*" multiple hidden />
      </div>
    </header>

    <div class="scan-body">
      <!-- 左侧：页面列表 -->
      <aside class="scan-pages glass" id="scan-pages">
        <div class="scan-pages__head">
          <span class="scan-pages__count" id="page-count">0 页</span>
          <span class="scan-pages__tip">拖拽调整顺序</span>
        </div>
        <div class="scan-pages__list" id="page-list"></div>
        <div class="scan-drop" id="scan-drop" role="button" tabindex="0" aria-label="选择图片导入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p>点击选择图片</p>
          <p class="scan-drop__hint">也可拖拽文件到此处，或直接粘贴截图</p>
        </div>
      </aside>

      <!-- 右侧：编辑区 -->
      <section class="scan-editor">
        <div class="scan-toolbar glass" id="scan-toolbar">
          
          <div class="scan-toolbar__group" role="group" aria-label="旋转">
            <span class="scan-toolbar__label">旋转</span>
            <button class="btn btn-sm btn-secondary" id="btn-rotate-left" type="button" title="左转 90 度">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
                <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
              </svg>
            </button>
            <button class="btn btn-sm btn-secondary" id="btn-rotate-right" type="button" title="右转 90 度">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
                <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
            </button>
          </div>
          <div class="scan-toolbar__group" role="group" aria-label="四角">
            <span class="scan-toolbar__label" title="四个控制点，用于圈定文档边界">四角</span>
            <button class="btn btn-sm btn-secondary" id="btn-detect" type="button"
              title="自动识别文档的四个角">自动识别</button>
            <button class="btn btn-sm btn-secondary" id="btn-reset-corners" type="button"
              title="四角恢复为整图范围">重置</button>
          </div>
          <div class="scan-toolbar__group" role="group" aria-label="曲面矫正">
            <span class="scan-toolbar__label" title="按四角做透视变换，把斜拍的页面拉直；导出图片与 PDF 时生效">曲面矫正</span>
            <button class="btn btn-sm btn-secondary" id="btn-adjust" type="button"
              title="进入矫正调整：画布切到原图，拖动四角微调矫正范围">调整</button>
          </div>
          <div class="scan-toolbar__group" role="group" aria-label="文档效果">
            <span class="scan-toolbar__label">效果</span>
            <div class="segmented" id="filter-segmented">
              <button class="segmented__btn segmented__btn--active" data-filter="original" type="button">原图</button>
              <button class="segmented__btn" data-filter="bw" type="button">黑白</button>
              <button class="segmented__btn" data-filter="enhance" type="button">增强</button>
            </div>
          </div>
          <div class="scan-toolbar__group" role="group" aria-label="去除手写">
            <span class="scan-toolbar__label" title="自动识别彩色笔迹并用本地 AI 修复背景，仅支持红笔与蓝笔">去手写</span>
            <select class="scan-select" id="ink-type" aria-label="笔迹类型">
              <option value="red">红笔</option>
              <option value="blue">蓝笔</option>
            </select>
            <select class="scan-select" id="ink-scope" aria-label="处理范围">
              <option value="current">本页</option>
              <option value="all">全部页面</option>
            </select>
            <button class="btn btn-sm btn-secondary" id="btn-erase-ink" type="button" title="擦除笔迹">擦除</button>
          </div>
          <div class="scan-toolbar__group" role="group" aria-label="页面顺序">
            <span class="scan-toolbar__label">顺序</span>
            <button class="btn btn-sm btn-secondary" id="btn-move-up" type="button" title="当前页上移" aria-label="当前页上移">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
                <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
              </svg>
            </button>
            <button class="btn btn-sm btn-secondary" id="btn-move-down" type="button" title="当前页下移" aria-label="当前页下移">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
                <line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>
              </svg>
            </button>
          </div>
          
          
          
          <!-- 四角：只是定义边界的控制点，本身不产生结果 -->
          
          <!-- 曲面矫正：用四角把页面透视拉直，是独立的一道工序 -->
          
        </div>

        <div class="scan-canvas-wrap glass" id="canvas-wrap">
          <canvas id="scan-canvas" hidden></canvas>
          <svg class="corner-layer" id="corner-layer" hidden></svg>
          <div class="canvas-adjust-bar" id="adjust-bar" hidden>
            <span>拖动四角定义矫正范围</span>
            <button class="btn btn-sm btn-primary" id="btn-adjust-done" type="button">完成</button>
          </div>
          <button class="canvas-compare" id="btn-compare" type="button" hidden
            title="按住查看未矫正的原图，松开回到矫正结果" aria-label="按住查看未矫正的原图">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
          <div class="scan-empty" id="editor-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" width="48" height="48">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M3 9h18M9 3v18" stroke-dasharray="2 2"/>
            </svg>
            <p>导入图片后在此编辑</p>
            <p class="scan-empty__hint">自动识别文档四角 · 黑白 / 增强滤镜 · 曲面矫正 · 合并导出 PDF</p>
          </div>
          <div class="scan-busy" id="scan-busy" hidden>
            <div class="scan-busy__box">
              <div class="scan-busy__head">
                <span class="scan-busy__spinner"></span>
                <span id="scan-busy-text">处理中...</span>
                <span class="scan-busy__pct" id="scan-busy-pct" hidden>0%</span>
              </div>
              <div class="scan-busy__bar" id="scan-busy-bar" hidden>
                <div class="scan-busy__fill" id="scan-busy-fill"></div>
              </div>
              <button class="scan-busy__cancel" id="btn-cancel" type="button" hidden>取消</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- 底部导出栏 -->
    <footer class="scan-footer glass">
      <div class="scan-footer__info" id="export-info">共 0 页</div>
      <div class="scan-footer__actions">
        <button class="btn btn-secondary" id="btn-export-one" type="button" disabled>导出当前页图片</button>
        <button class="btn btn-primary" id="btn-export-pdf" type="button" disabled>合并导出 PDF</button>
      </div>
    </footer>

    <div class="toast-container" id="toast-container" aria-live="polite"></div>
  </main>

</body>
</html>
