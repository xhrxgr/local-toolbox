<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>全量移动端审计</title>
  <style>
    body { font: 13px monospace; background: #0f172a; color: #e2e8f0; margin: 0; padding: 12px; }
    #out { white-space: pre-wrap; }
    #prog { color: #94a3b8; margin-bottom: 8px; }
    iframe { display: none; }
  </style>
</head>
<body>
  <div id="prog">running...</div>
  <div id="out"></div>
  <script data-targets='[["/tools/cert/", "cert"], ["/tools/chmod/", "chmod"], ["/tools/color/", "color"], ["/tools/countdown/", "countdown"], ["/tools/crypto/", "crypto"], ["/tools/diff/", "diff"], ["/tools/document/", "document"], ["/tools/encoding/", "encoding"], ["/tools/ffmpeg/", "ffmpeg"], ["/tools/hash/", "hash"], ["/tools/image/", "image"], ["/tools/json/", "json"], ["/tools/jwt/", "jwt"], ["/tools/markdown/", "markdown"], ["/tools/network/", "network"], ["/tools/ocr/", "ocr"], ["/tools/otp-migration/", "otp-migration"], ["/tools/password/", "password"], ["/tools/qrcode/", "qrcode"], ["/tools/radix/", "radix"], ["/tools/regex/", "regex"], ["/tools/scandoc/", "scandoc"], ["/tools/sqlcron/", "sqlcron"], ["/tools/stopwatch/", "stopwatch"], ["/tools/svg/", "svg"], ["/tools/text/", "text"], ["/tools/timestamp/", "timestamp"], ["/tools/unicode/", "unicode"], ["/tools/unit/", "unit"], ["/tools/worldclock/", "worldclock"], ["/", "\u9996\u9875"]]'>
    var TARGETS = JSON.parse(document.currentScript.dataset.targets || '[]');
    var WIDTHS = [390];
    var results = [];
    var queue = [];
    WIDTHS.forEach(function (w) { TARGETS.forEach(function (t) { queue.push([w, t[0], t[1]]); }); });
    var total = queue.length, doneCount = 0;

    function next() {
      if (!queue.length) { finish(); return; }
      var job = queue.shift();
      measure(job[0], job[1], job[2], next);
    }

    function measure(width, url, name, done) {
      var f = document.createElement('iframe');
      f.style.width = width + 'px';
      f.style.height = '860px';
      f.style.position = 'fixed';
      f.style.left = '-99999px';
      f.style.top = '0';
      f.style.border = '0';
      f.src = url;
      var settled = false;
      function finishOnce() {
        if (settled) return;
        settled = true;
        try { report(width, name, f.contentDocument, f.contentWindow); } catch (e) {
          results.push(width + ' | ' + name + ' | 测量失败: ' + e.message);
        }
        doneCount++;
        document.getElementById('prog').textContent = '进度 ' + doneCount + '/' + total;
        f.remove();
        done();
      }
      f.onload = function () { setTimeout(finishOnce, 700); };
      setTimeout(finishOnce, 5000);
      document.body.appendChild(f);
    }

    function report(width, name, doc, win) {
      var issues = [];
      var de = doc.documentElement;
      if (de.scrollWidth > width + 1) issues.push('页面横向溢出 ' + de.scrollWidth + 'px');
      var all = doc.body ? doc.body.querySelectorAll('*') : [];
      var offenders = [];
      for (var i = 0; i < all.length && offenders.length < 3; i++) {
        var el = all[i], r = el.getBoundingClientRect();
        if (r.width === 0) continue;
        if (r.right > width + 2) {
          var cs = win.getComputedStyle(el);
          if (cs.position === 'fixed' && parseFloat(cs.left) < -9999) continue;
          // 在可横向滚动容器内的不算溢出
          var p = el.parentElement, inScroller = false;
          while (p && p !== doc.body) {
            var pcs = win.getComputedStyle(p);
            if (pcs.overflowX === 'auto' || pcs.overflowX === 'scroll') { inScroller = true; break; }
            p = p.parentElement;
          }
          if (inScroller) continue;
          offenders.push((el.tagName.toLowerCase() + (el.id ? '#' + el.id : '')) + ' r=' + Math.round(r.right));
        }
      }
      if (offenders.length) issues.push('溢出: ' + offenders.join(', '));

      var small = [];
      var els = doc.body ? doc.body.querySelectorAll('button,a,input,select,[role=button],summary') : [];
      for (var j = 0; j < els.length && small.length < 5; j++) {
        var e2 = els[j], r2 = e2.getBoundingClientRect();
        if (r2.width === 0 || r2.height === 0) continue;
        var cs2 = win.getComputedStyle(e2);
        if (cs2.display === 'none' || cs2.visibility === 'hidden') continue;
        if (e2.type === 'checkbox' || e2.type === 'radio') continue; // 原生框，看 label
        if (r2.height < 34) small.push((e2.id || e2.tagName.toLowerCase()) + ' ' + Math.round(r2.width) + 'x' + Math.round(r2.height));
      }
      if (small.length) issues.push('触控<34px: ' + small.join(', '));

      var tiny = [];
      var texts = doc.body ? doc.body.querySelectorAll('p,span,div,label,li,td,th,option,h1,h2,h3,h4') : [];
      var seen = {};
      for (var k = 0; k < texts.length && tiny.length < 3; k++) {
        var e3 = texts[k];
        if (!e3.textContent || e3.textContent.trim().length < 2 || e3.children.length > 0) continue;
        var fs2 = parseFloat(win.getComputedStyle(e3).fontSize);
        if (fs2 < 12) { var key = fs2; if (!seen[key]) { seen[key] = 1; tiny.push((e3.className || e3.tagName) + ' ' + fs2 + 'px'); } }
      }
      if (tiny.length) issues.push('字号<12px: ' + tiny.join(', '));

      var clipped = [];
      var sc = doc.body ? doc.body.querySelectorAll('div,section,main,table,pre,form') : [];
      for (var m = 0; m < sc.length && clipped.length < 3; m++) {
        var e4 = sc[m];
        if (e4.scrollWidth > e4.clientWidth + 4 && e4.clientWidth > 40) {
          var o = win.getComputedStyle(e4).overflowX;
          if (o === 'visible' || o === 'hidden') clipped.push((e4.className || e4.tagName) + ' ' + e4.scrollWidth + '>' + e4.clientWidth);
        }
      }
      if (clipped.length) issues.push('内容被裁: ' + clipped.join(', '));

      results.push('[' + width + '] ' + name + (issues.length ? '\n    - ' + issues.join('\n    - ') : '  OK'));
    }

    function finish() {
      document.getElementById('out').textContent = results.join('\n');
      window.__done = true;
    }
    next();
  </script>
</body>
</html>
